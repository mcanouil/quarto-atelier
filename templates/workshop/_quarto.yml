project:
  type: atelier

metadata-files:
  - _sidebars.yml

website:
  title: "My workshop"
  description: "A short description of my workshop."
  repo-url: https://github.com/owner/project
  navbar: false
  search:
    location: sidebar
    type: textbox

brand: _brand.yml

extensions:
  atelier:
    version: "2026"
    mode: workshop
  # Off until you set website.site-url: the PDF and the deck then turn relative
  # links into links to the published site. Remove these two lines after you set it.
  portable-links:
    enabled: false
