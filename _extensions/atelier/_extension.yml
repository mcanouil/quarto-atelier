title: Atelier
author: Mickaël Canouil
version: 0.15.3
quarto-required: ">=1.12.1"
contributes:
  project:
    project:
      type: website
      output-dir: _site
    website:
      repo-actions: [edit, issue]
      repo-link-target: _blank
      repo-link-rel: noopener noreferrer
      # `locale` matches `lang: en-GB` below; override the two together.
      # Naming `twitter-card` at all is what switches Quarto's Twitter
      # provider on, after which it inherits title, description, image, and
      # image alt from each page.
      open-graph:
        locale: en_GB
      twitter-card:
        card-style: summary_large_image
      page-navigation: true
      back-to-top-navigation: true
      llms-txt: true
      search:
        location: navbar
        type: overlay
      # `background` and `foreground` are left to the theme on both bars: the
      # chrome palette in `html/chrome.scss` sets `$navbar-bg`, `$navbar-fg`,
      # `$footer-bg`, and `$footer-fg` from a layer Quarto evaluates first, so
      # naming them here would be a configuration with no effect.
      navbar:
        search: true
      page-footer:
        border: true
        left: |
          Powered by [Quarto](https://quarto.org){target="_blank" rel="noopener noreferrer"}.
        center: |
          &copy; []{#current-year} [Mickaël CANOUIL](https://mickael.canouil.fr){target="_blank" rel="noopener noreferrer"}.
    # Quarto renders a notebook preview page with the plain `html` format, so
    # the page loses the `formats.html` options below. The project metadata
    # still reaches it, so this repeats the scheme option at the project level.
    # Upstream: https://github.com/quarto-dev/quarto-cli/issues/14954
    # Remove when: the minimum Quarto version includes the fix.
    respect-user-color-scheme: true
    format: atelier-html
  formats:
    common:
      lang: en-GB
      language: _language.yml
      date-format: "dddd[, the] Do [of] MMMM, YYYY"
      code-copy: true
      code-overflow: wrap
      code-link: false
      # gitlink does not rewrite references in prose in any format. The widget
      # shows only in HTML, where a navbar item or sidebar tool has the href
      # `#gitlink-widget`.
      extensions:
        gitlink:
          enabled: false
      # Each embedded extension under `_extensions/mcanouil/` runs through a
      # wrapper in `bundled/`, at the stage that its own manifest sets. A
      # wrapper does nothing when the project has its own copy of the same
      # extension under `_extensions/`, with any owner, so a project that names
      # its copy in `filters` runs that copy only. Quarto always loads the
      # shortcodes of a copy, so they replace the embedded ones; name the copy
      # in `filters` too, or the render warns.
      shortcodes:
        - iconify
      filters:
        - atelier-chrome.lua
        - atelier-workshop.lua
        - social-metadata.lua
        - bundled/iconify.lua
        - path: bundled/code-window.lua
          at: pre-quarto
        - path: bundled/gitlink.lua
          at: post-quarto
        - bundled/toc-depth.lua
        - path: bundled/prism.lua
          at: pre-ast
        - path: bundled/div-reuse.lua
          at: post-quarto
        - bundled/highlight-text.lua
        - path: bundled/offset-headings.lua
          at: pre-ast
        - path: bundled/preview-colour.lua
          at: post-quarto
        - path: bundled/veil.lua
          at: pre-quarto
        - path: bundled/typst-render.lua
          at: pre-quarto
        - path: bundled/typst-math.lua
          at: post-quarto
        - bundled/portable-links.lua
    html:
      respect-user-color-scheme: true
      # The title block writes the authors of `workshop/core.lua`, with their
      # photos and details, and the keywords as chips, with no script.
      template-partials:
        - html/title-metadata.html
      # Quarto builds the canonical link from `website.site-url`, giving a
      # directory index the URL of its directory. Set `canonical-url: false`
      # on a page served from more than one URL, such as `404.qmd`.
      canonical-url: true
      # `html/chrome.scss` comes before `brand` on purpose: Quarto evaluates
      # user layer defaults in reverse list order, so a file placed first is
      # evaluated last, after the brand palette it derives the chrome from.
      # `html/presets.scss` comes second, so it is evaluated after `brand` and
      # before `html/chrome.scss`. The scheme flag comes last, so it is
      # evaluated first and tells every other file which bundle it builds.
      theme:
        light:
          - html/chrome.scss
          - html/presets.scss
          - brand
          - html/theme.scss
          - html/navigation.scss
          - html/content.scss
          - html/pages.scss
          - html/workshop.scss
          - html/terminal.scss
          - html/highlighting-tokens.scss
          - html/highlighting.scss
          - html/scheme-light.scss
        dark:
          - html/chrome.scss
          - html/dark.scss
          - html/presets.scss
          - brand
          - html/theme.scss
          - html/navigation.scss
          - html/content.scss
          - html/pages.scss
          - html/workshop.scss
          - html/terminal.scss
          - html/highlighting-tokens.scss
          - html/highlighting.scss
          - html/scheme-dark.scss
      syntax-highlighting:
        light: arrow-light
        dark: arrow-dark
      toc: true
      toc-depth: 3
      anchor-sections: true
      link-external-newwindow: true
      grid:
        sidebar-width: 300px
        body-width: 1000px
        margin-width: 300px
      filters:
        - bundled/mobile-toc.lua
        - bundled/collapse-output.lua
        - bundled/remember.lua
        - atelier-html-logo.lua
      # Each embedded extension keeps its own defaults, set per site under
      # `extensions:`, with these exceptions. gitlink shows its repository
      # widget, and the common options keep it from rewriting prose. remember offers no resume on the home page and the 404 page; Quarto
      # joins this list with a site's own `page-exclude` list, so a site can add
      # pages but cannot remove these two. prism and offset-headings both run in
      # the pre-AST stage, where list order decides which runs first. prism
      # stays before offset-headings, so a format-scoped attribute such as
      # `atelier-html:offset-headings-by` is promoted before offset-headings
      # reads it.
      extensions:
        gitlink:
          widget:
            enabled: true
        remember:
          page-exclude:
            - index.qmd
            - 404.qmd
      include-in-header:
        - file: html/scripts/page-load.html
        - file: html/scripts/course-model.html
        - file: html/scripts/course-stepper.html
        - file: html/scripts/sidebar-header.html
        - file: html/scripts/toc-early.html
      include-after-body:
        - file: html/scripts/current-year.html
        - file: html/scripts/external-links.html
        - file: html/scripts/ordinal-dates.html
        - file: html/scripts/a11y-fixes.html
        - file: html/scripts/navbar-tooltips.html
        - file: html/scripts/header-scroll.html
        - file: html/scripts/sidebar-offset.html
        - file: html/scripts/chrome.html
        - file: html/scripts/reading-bar.html
        - file: html/scripts/course.html
        - file: html/scripts/announcement.html
        - file: html/scripts/toc-card.html
        - file: html/scripts/title-block.html
        - file: html/scripts/code-blocks.html
        - file: html/scripts/listings.html
        - file: html/scripts/table-scroll.html
    typst:
      # The Typst template relies on the shift that Quarto applies to the
      # headings, so the offset-headings warning about that shift has no use.
      extensions:
        offset-headings:
          quarto-shift-warning: false
      papersize: a4
      margin:
        x: 20mm
        y: 25mm
      # Typst cannot read the WOFF2 files, so `fonts/` also holds static TTF
      # cuts of the Atelier fonts.
      font-paths: fonts
      pdf-standard: ua-1
      filters:
        - atelier-typst.lua
        - path: bundled/typst-extras.lua
          at: post-quarto
      template-partials:
        - typst/tokens.typ
        - typst/motifs.typ
        - typst/elements.typ
        - typst/chrome.typ
        - typst/title.typ
        - typst/toc.typ
        - typst/workshop.typ
        - typst/typst-template.typ
        - typst/typst-show.typ
    revealjs:
      width: 1280
      height: 720
      slide-number: c/t
      progress: true
      # The colours come from `atelier-revealjs.lua`, which writes the
      # `--atelier-*` tokens of `palette.lua`: Quarto gives the deck Sass no
      # brand defaults, so the Sass cannot read the preset.
      theme:
        - revealjs/deck.scss
      template-partials:
        - revealjs/title-slide.html
      revealjs-plugins:
        - a11y
        - codefrag
        - tabset
        - veil
      filters:
        - path: bundled/cascade.lua
          at: pre-ast
        - bundled/codefrag.lua
        - path: atelier-revealjs.lua
          at: post-quarto
