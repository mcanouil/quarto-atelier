title: Atelier
author: Mickaël Canouil
version: 0.11.0
quarto-required: ">=1.12.1"
contributes:
  project:
    project:
      type: website
      output-dir: _site
    website:
      repo-actions: [edit, issue]
      repo-link-target: _blank
      repo-link-rel: noopener noreferrer
      # `locale` matches `lang: en-GB` below; override the two together.
      # Naming `twitter-card` at all is what switches Quarto's Twitter
      # provider on, after which it inherits title, description, image, and
      # image alt from each page.
      open-graph:
        locale: en_GB
      twitter-card:
        card-style: summary_large_image
      page-navigation: true
      back-to-top-navigation: true
      llms-txt: true
      search:
        location: navbar
        type: overlay
      # `background` and `foreground` are left to the theme on both bars: the
      # chrome palette in `html/chrome.scss` sets `$navbar-bg`, `$navbar-fg`,
      # `$footer-bg`, and `$footer-fg` from a layer Quarto evaluates first, so
      # naming them here would be a configuration with no effect.
      navbar:
        search: true
      page-footer:
        border: true
        left: |
          Powered by [Quarto](https://quarto.org){target="_blank" rel="noopener noreferrer"}.
        center: |
          &copy; []{#current-year} [Mickaël CANOUIL](https://mickael.canouil.fr){target="_blank" rel="noopener noreferrer"}.
    # Quarto renders a notebook preview page with the plain `html` format, so
    # the page loses the `formats.html` options below. The project metadata
    # still reaches it, so this repeats the scheme option at the project level.
    # Upstream: https://github.com/quarto-dev/quarto-cli/issues/14954
    # Remove when: the minimum Quarto version includes the fix.
    respect-user-color-scheme: true
    format: atelier-html
  formats:
    common:
      lang: en-GB
      language: _language.yml
      date-format: "dddd[, the] Do [of] MMMM, YYYY"
      code-copy: true
      code-overflow: wrap
      code-link: false
    html:
      respect-user-color-scheme: true
      # Quarto builds the canonical link from `website.site-url`, giving a
      # directory index the URL of its directory. Set `canonical-url: false`
      # on a page served from more than one URL, such as `404.qmd`.
      canonical-url: true
      # `html/chrome.scss` comes before `brand` on purpose: Quarto evaluates
      # user layer defaults in reverse list order, so a file placed first is
      # evaluated last, after the brand palette it derives the chrome from.
      # `html/presets.scss` comes second, so it is evaluated after `brand` and
      # before `html/chrome.scss`. The scheme flag comes last, so it is
      # evaluated first and tells every other file which bundle it builds.
      theme:
        light:
          - html/chrome.scss
          - html/presets.scss
          - brand
          - html/theme.scss
          - html/navigation.scss
          - html/content.scss
          - html/pages.scss
          - html/workshop.scss
          - html/terminal.scss
          - html/highlighting-tokens.scss
          - html/highlighting.scss
          - html/scheme-light.scss
        dark:
          - html/chrome.scss
          - html/dark.scss
          - html/presets.scss
          - brand
          - html/theme.scss
          - html/navigation.scss
          - html/content.scss
          - html/pages.scss
          - html/workshop.scss
          - html/terminal.scss
          - html/highlighting-tokens.scss
          - html/highlighting.scss
          - html/scheme-dark.scss
      syntax-highlighting:
        light: arrow-light
        dark: arrow-dark
      toc: true
      toc-depth: 3
      anchor-sections: true
      link-external-newwindow: true
      grid:
        sidebar-width: 300px
        body-width: 1000px
        margin-width: 300px
      # The embedded extensions under `_extensions/mcanouil/` are named here,
      # and Quarto resolves each name to the filters or shortcodes of the
      # embedded copy. A project resolves the names in its own `filters` list
      # against its own `_extensions/` only. A project that keeps its own copy
      # of one of these extensions and names it there runs both copies, and its
      # own shortcodes replace the embedded ones.
      shortcodes:
        - iconify
      filters:
        - atelier-chrome.lua
        - atelier-workshop.lua
        - social-metadata.lua
        - iconify
        - code-window
        - gitlink
        - toc-depth
        - mobile-toc
        - collapse-output
        - prism
        - div-reuse
        - highlight-text
        - offset-headings
        - preview-colour
        - remember
        - veil
      # Each embedded extension keeps its own defaults, set per site under
      # `extensions:`, with these exceptions. gitlink shows its repository
      # widget, but does not rewrite references in prose. The widget shows only
      # where a navbar item or sidebar tool has the href `#gitlink-widget`. Code
      # Window draws a window only where a block has a `filename`, and does not
      # make a label from the language of every other block. remember offers no
      # resume on the home page and the 404 page; Quarto joins this list with a
      # site's own `page-exclude` list, so a site can add pages but cannot
      # remove these two. prism and offset-headings both run in the pre-AST
      # stage, where list order decides which runs first. prism stays before
      # offset-headings, so a format-scoped attribute such as
      # `atelier-html:offset-headings-by` is promoted before offset-headings
      # reads it.
      extensions:
        gitlink:
          enabled: false
          widget:
            enabled: true
        code-window:
          auto-filename: false
        remember:
          page-exclude:
            - index.qmd
            - 404.qmd
      include-after-body:
        - file: html/scripts/current-year.html
        - file: html/scripts/external-links.html
        - file: html/scripts/ordinal-dates.html
        - file: html/scripts/a11y-fixes.html
        - file: html/scripts/navbar-tooltips.html
        - file: html/scripts/chrome.html
        - file: html/scripts/course-model.html
        - file: html/scripts/reading-bar.html
        - file: html/scripts/course.html
        - file: html/scripts/announcement.html
        - file: html/scripts/toc-card.html
        - file: html/scripts/title-block.html
        - file: html/scripts/code-blocks.html
        - file: html/scripts/listings.html
        - file: html/scripts/table-scroll.html
