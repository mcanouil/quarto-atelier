<script id="sidebar-offset" type="text/javascript">
	/**
	 * @license MIT
	 * @copyright 2026 Mickaël Canouil
	 * @author Mickaël Canouil
	 */
	// A floating sidebar is a card, and the card keeps a gap from the header.
	// Quarto writes the header height only as inline `top` and `max-height`
	// values on the sidebar, which a stylesheet cannot read. This script copies
	// the offset that Quarto computes into `--atelier-header-offset`, with 0
	// when Headroom hides the header, so that the stylesheet can add the gap.
	// Quarto sets `data-bs-offset` on the body at each update, the first one
	// included, but sends no event for the first one. So the script watches
	// that attribute. The call on DOMContentLoaded gives 0 to a page with no
	// header, where Quarto does not set the attribute before it scrolls.
	// Remove when: never, because Atelier makes the floating sidebar a card.
	(function () {
		var update = function () {
			var sidebar = document.getElementById("quarto-sidebar");
			if (!sidebar || !document.body.classList.contains("floating")) return;
			var offset = sidebar.classList.contains("sidebar-unpinned")
				? 0
				: Number(document.body.getAttribute("data-bs-offset")) || 0;
			document.documentElement.style.setProperty("--atelier-header-offset", offset + "px");
		};
		document.addEventListener("DOMContentLoaded", update);
		new MutationObserver(update).observe(document.body, {
			attributes: true,
			attributeFilter: ["data-bs-offset"],
		});
	})();
</script>
