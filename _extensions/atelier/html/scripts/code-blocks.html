<script id="atelier-code-blocks" type="text/javascript">
	(function () {
		// Quarto documents line highlighting for Reveal.js only, so the filter
		// copies the line spec of `code-window-lines` or `code-line-numbers` to
		// `data-atelier-highlight`.
		// A spec is a comma-separated list of numbers and ranges such as 1,3-4.
		function parseSpec(spec) {
			var numbers = [];
			spec.split(",").forEach(function (part) {
				var match = /^\s*(\d+)(?:\s*-\s*(\d+))?\s*$/.exec(part);
				if (!match) {
					console.warn("Atelier: ignoring '" + part.trim() + "' in the code-line-numbers spec '" + spec + "'.");
					return;
				}
				var first = parseInt(match[1], 10);
				var last = match[2] ? parseInt(match[2], 10) : first;
				for (var line = first; line <= last; line++) {
					numbers.push(line);
				}
			});
			return numbers;
		}

		// Add a class to each line that the spec in the attribute lists. A line
		// is the span with the id of the block, a dash, and the line number.
		function markLines(attribute, className) {
			document.querySelectorAll("[" + attribute + "]").forEach(function (block) {
				var prefix = block.id;
				if (!prefix) {
					return;
				}
				parseSpec(block.getAttribute(attribute)).forEach(function (line) {
					var span = document.getElementById(prefix + "-" + line);
					if (span) {
						span.classList.add(className);
					}
				});
			});
		}

		markLines("data-atelier-highlight", "atelier-line-highlight");

		// The terminal block lists the lines that had a `$` prompt in
		// `data-atelier-prompt`, and the style draws the prompt before them.
		markLines("data-atelier-prompt", "atelier-prompt-line");

		// The lines that continue a command after a `\` are in
		// `data-atelier-continuation`. They take the command colour, with no prompt.
		markLines("data-atelier-continuation", "atelier-command-line");

		// The style centres the copy button on the window header, which grows
		// when its items wrap, so the window keeps the header height in a variable.
		// Code Window replaces the header of a collapsible window with a `summary`.
		var headerHeights = new ResizeObserver(function (entries) {
			entries.forEach(function (entry) {
				var codeWindow = entry.target.parentElement;
				if (!codeWindow) {
					headerHeights.unobserve(entry.target);
					return;
				}
				var height = entry.target.clientHeight + "px";
				if (codeWindow.style.getPropertyValue("--atelier-code-header-height") !== height) {
					codeWindow.style.setProperty("--atelier-code-header-height", height);
				}
			});
		});

		// The window header shows the language beside the file name. The language
		// is the first class of the code that is not a Quarto, Pandoc, or Code
		// Window class. Code Window classes start with `cw-`.
		var ignored = ["sourceCode", "numberSource", "number-lines", "code-with-copy", "code-annotation-code", "terminal", "atelier-terminal"];
		function setUpWindows() {
			document.querySelectorAll(".code-with-filename").forEach(function (codeWindow) {
				var header = codeWindow.querySelector(":scope > .code-with-filename-file");
				if (!header) {
					return;
				}
				headerHeights.observe(header);
				var pre = codeWindow.querySelector("pre.sourceCode");
				if (!pre || header.querySelector(".atelier-code-language")) {
					return;
				}
				if (pre.classList.contains("atelier-terminal")) {
					codeWindow.classList.add("atelier-terminal");
				}
				var language = Array.prototype.find.call(pre.classList, function (name) {
					return ignored.indexOf(name) === -1 && name.indexOf("cw-") !== 0;
				});
				if (!language) {
					return;
				}
				var label = document.createElement("span");
				label.className = "atelier-code-language";
				label.textContent = language;
				header.append(label);
			});
		}
		setUpWindows();
		// Code Window builds the wrappers for auto-filename blocks on DOMContentLoaded.
		document.addEventListener("DOMContentLoaded", setUpWindows);
	})();
</script>
