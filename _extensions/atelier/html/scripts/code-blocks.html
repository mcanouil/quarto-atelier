<script id="atelier-code-blocks" type="text/javascript">
	(function () {
		// Quarto documents line highlighting for Reveal.js only, so the filter
		// copies the line spec of `code-window-lines` or `code-line-numbers` to
		// `data-atelier-highlight`.
		// A spec is a comma-separated list of numbers and ranges such as 1,3-4.
		function parseSpec(spec) {
			var numbers = [];
			spec.split(",").forEach(function (part) {
				var match = /^\s*(\d+)(?:\s*-\s*(\d+))?\s*$/.exec(part);
				if (!match) {
					console.warn("Atelier: ignoring '" + part.trim() + "' in the code-line-numbers spec '" + spec + "'.");
					return;
				}
				var first = parseInt(match[1], 10);
				var last = match[2] ? parseInt(match[2], 10) : first;
				for (var line = first; line <= last; line++) {
					numbers.push(line);
				}
			});
			return numbers;
		}

		document.querySelectorAll("[data-atelier-highlight]").forEach(function (block) {
			var prefix = block.id;
			if (!prefix) {
				return;
			}
			parseSpec(block.getAttribute("data-atelier-highlight")).forEach(function (line) {
				var span = block.querySelector('span[id="' + prefix + "-" + line + '"]');
				if (span) {
					span.classList.add("atelier-line-highlight");
				}
			});
		});

		// The window header shows the language beside the file name. The language
		// is the first class of the code that is not a Quarto or Pandoc class.
		var ignored = ["sourceCode", "numberSource", "number-lines", "code-with-copy", "code-annotation-code"];
		document.querySelectorAll(".code-with-filename").forEach(function (window) {
			var header = window.querySelector(".code-with-filename-file");
			var pre = window.querySelector("pre.sourceCode");
			if (!header || !pre || header.querySelector(".atelier-code-language")) {
				return;
			}
			var language = Array.prototype.find.call(pre.classList, function (name) {
				return ignored.indexOf(name) === -1;
			});
			if (!language) {
				return;
			}
			var label = document.createElement("span");
			label.className = "atelier-code-language";
			label.textContent = language;
			header.append(label);
		});
	})();
</script>
