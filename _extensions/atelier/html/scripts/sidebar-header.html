<script id="atelier-sidebar-header" type="text/javascript">
	(function () {
		// This script is in the head. It runs on the "sidebar" stage of page-load.html,
		// so the sidebar header is complete at the first paint and does not move the menu.
		if (!window.atelierStages) {
			console.warn("Atelier: the sidebar header needs page-load.html, which is not in the head.");
			return;
		}

		function readVersion() {
			try {
				return JSON.parse(document.getElementById("atelier-options")?.textContent || "{}").version;
			} catch (error) {
				return undefined;
			}
		}

		window.atelierStages.on("sidebar", function () {
			// The version pill follows the title link in the sidebar. Without a
			// version, no pill is added. page-load.html adds the pill of the navbar.
			var version = readVersion();
			if (version) {
				document.querySelectorAll(".sidebar-title > a").forEach(function (title) {
					var pill = document.createElement("span");
					pill.className = "atelier-version";
					pill.textContent = version;
					title.after(pill);
				});
			}

			// With a search field in the sidebar header, the tools follow the field
			// instead of sitting under the title. The field sits in a wrapper, so the
			// tools become the wrapper's next sibling.
			var search = document.querySelector("#quarto-sidebar .sidebar-search");
			var tools = document.querySelector("#quarto-sidebar .sidebar-tools-main");
			if (search && tools && search.parentElement) {
				search.parentElement.after(tools);
			}
		});
	})();
</script>
