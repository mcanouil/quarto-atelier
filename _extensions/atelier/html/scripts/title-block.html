<script id="atelier-title-block" type="text/javascript">
	(function () {
		// Quarto writes the keywords as one comma-separated paragraph by design.
		// The chip design needs one element for each keyword, so the paragraph is
		// split here. Without JavaScript the paragraph stays as Quarto wrote it.
		var paragraph = document.querySelector(".keywords > p");
		if (!paragraph) {
			return;
		}
		var keywords = paragraph.textContent
			.split(",")
			.map(function (keyword) {
				return keyword.trim();
			})
			.filter(Boolean);
		paragraph.replaceChildren.apply(
			paragraph,
			keywords.map(function (keyword) {
				var chip = document.createElement("span");
				chip.className = "atelier-keyword";
				chip.textContent = keyword;
				return chip;
			}),
		);
	})();
</script>
