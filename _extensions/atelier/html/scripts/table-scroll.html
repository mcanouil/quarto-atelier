<script id="atelier-table-scroll" type="text/javascript">
  /**

   * @author Mickaël Canouil
   */
  // A wide table cannot wrap, so it scrolls in its own box on a narrow screen.
  // Remove when: never.
  // Not SCSS: a table that scrolls by itself loses its table layout, so the
  // scroll box has to be a new element around the table.
  (() => {
    const SCROLLS = ['auto', 'scroll', 'hidden', 'clip'];
    // Content the keyboard reaches already scrolls the box, so a box that holds
    // some needs no tab stop of its own, as in Quarto's scrollable-regions.js.
    const FOCUSABLE =
      'a[href]:not([tabindex="-1"]), button:not(:disabled), input:not(:disabled), ' +
      'select:not(:disabled), textarea:not(:disabled), [tabindex]:not([tabindex="-1"])';
    let captions = 0;

    function scrollsAlready(table) {
      for (let node = table.parentElement; node && node !== document.body; node = node.parentElement) {
        if (SCROLLS.includes(getComputedStyle(node).overflowX)) return true;
      }
      return false;
    }

    // A box that scrolls must take the keyboard focus, so that a keyboard user
    // can scroll it (WCAG 2.1.1). It is a region named by the table caption,
    // so that a screen reader says what gets the focus. The attributes are set
    // only while the box scrolls, so a table that fits adds no tab stop.
    function syncFocus(box) {
      const caption = box.querySelector(':scope > table > caption');
      if (box.scrollWidth > box.clientWidth && !box.querySelector(FOCUSABLE)) {
        box.setAttribute('tabindex', '0');
        if (caption) {
          if (!caption.id) caption.id = `atelier-table-caption-${++captions}`;
          box.setAttribute('role', 'region');
          box.setAttribute('aria-labelledby', caption.id);
        }
      } else {
        box.removeAttribute('tabindex');
        box.removeAttribute('role');
        box.removeAttribute('aria-labelledby');
      }
    }

    // The box and the table are both observed: a web font that loads late makes
    // the table wider without a change to the size of the box.
    document.addEventListener('DOMContentLoaded', () => {
      const resize = new ResizeObserver((entries) => {
        entries.forEach((entry) => syncFocus(entry.target.closest('.atelier-table-scroll')));
      });
      document.querySelectorAll('main table').forEach((table) => {
        if (scrollsAlready(table)) return;
        const box = document.createElement('div');
        box.className = 'atelier-table-scroll';
        table.before(box);
        box.append(table);
        resize.observe(box);
        resize.observe(table);
      });
    });
  })();
</script>
