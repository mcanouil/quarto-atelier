<script id="atelier-course" type="text/javascript">
	(function () {
		// In workshop mode, these components show the course from
		// window.atelierCourse. Each block below is one component.
		var course = window.atelierCourse;
		if (!course || course.mode !== "workshop") return;

		function element(tag, className, text) {
			var node = document.createElement(tag);
			if (className) node.className = className;
			if (text) node.textContent = text;
			return node;
		}

		// =====================================================================
		// S3 COURSE STEPPER
		// =====================================================================
		// The sidebar menu shows each module with a number, its duration, and a
		// tick when all its pages are visited. A summary above the menu shows
		// the module position and the total time. Quarto's markup stays: the
		// script adds classes and elements only. All modules other than the
		// current module are collapsed, and Quarto's toggle opens them again.
		(function () {
			var menu = document.querySelector("#quarto-sidebar .sidebar-menu-container");
			var list = menu && menu.querySelector("ul");
			if (!list) return;

			// The course model keeps a top-level item as a module only when it
			// has a page link. The same filter gives the same order here.
			var items = Array.prototype.filter.call(list.children, function (item) {
				return Array.prototype.some.call(item.querySelectorAll("a.sidebar-link[href]"), function (link) {
					return link.getAttribute("href") !== "#";
				});
			});
			if (items.length !== course.modules.length) {
				console.warn("Atelier: the sidebar modules do not match the course; the stepper is not shown.");
				return;
			}

			menu.classList.add("atelier-stepper");
			var hasCurrent = course.currentModule !== -1;

			items.forEach(function (item, index) {
				var module = course.modules[index];
				var section = item.classList.contains("sidebar-item-section");
				var control = item.querySelector(":scope > .sidebar-item-container > " + (section ? ".sidebar-item-toggle" : "a.sidebar-link"));
				var text = control && control.querySelector(".menu-text");
				if (!text) return;

				var done = course.isComplete(index);
				var current = index === course.currentModule;
				item.classList.add("atelier-step");
				if (done) item.classList.add("atelier-step-done");
				if (current) item.classList.add("atelier-step-current");

				var dot = element("span", "atelier-step-dot", done ? "✓" : String(index + 1));
				dot.setAttribute("aria-hidden", "true");
				control.insertBefore(dot, control.firstChild);

				// The wrapper moves the label node with its id, so the section
				// list keeps its accessible name.
				var label = element("span", "atelier-step-label");
				text.parentNode.insertBefore(label, text);
				label.appendChild(text);
				if (done) {
					label.appendChild(element("span", "visually-hidden", " " + course.label("workshop-completed")));
				}
				if (module.minutes !== null) {
					label.appendChild(element("small", "atelier-step-time", course.format(module.minutes)));
				}

				if (section && hasCurrent && !current) {
					var target = item.querySelector(":scope > .sidebar-section");
					if (target) target.classList.remove("show");
					control.classList.add("collapsed");
					control.setAttribute("aria-expanded", "false");
				}
			});

			var summary = element("div", "atelier-course-summary");
			var parts = [];
			var m = course.modules.length;
			var n = course.currentModule + 1;
			if (hasCurrent) parts.push(course.label("workshop-position", { n: n, m: m }));
			if (course.totalMinutes !== null) {
				parts.push(course.label("workshop-total", { time: course.format(course.totalMinutes) }));
			}
			if (parts.length) summary.appendChild(element("p", "", parts.join(" · ")));
			var progress = element("div", "atelier-course-progress");
			progress.setAttribute("aria-hidden", "true");
			var fill = element("span");
			fill.style.width = (m ? (n / m) * 100 : 0) + "%";
			progress.appendChild(fill);
			summary.appendChild(progress);
			menu.parentNode.insertBefore(summary, menu);
		})();

		// =====================================================================
		// T3 PROGRESS DOTS
		// =====================================================================
		// The table of contents gets a dot for each heading, filled once the
		// heading has passed the top of the viewport, and a ring with the share
		// of the module read. The read headings are stored under the page in
		// the course progress. Quarto clones the table of contents into a
		// toggle on narrow pages. The clone is found again on every update, so
		// it shows the same dots.
		(function () {
			var toc = document.querySelector("#quarto-margin-sidebar #TOC");
			if (!toc) return;

			var anchors = Array.prototype.filter.call(toc.querySelectorAll("a.nav-link[data-scroll-target^='#']"), function (link) {
				return link.getAttribute("data-scroll-target").length > 1;
			});
			// Another script makes the href of a link absolute, so the entries
			// are matched on the target that Quarto keeps in a data attribute.
			var headings = [];
			anchors.forEach(function (link) {
				var target = link.getAttribute("data-scroll-target");
				var heading = document.getElementById(decodeURIComponent(target.slice(1)));
				if (heading) headings.push({ href: target, node: heading });
			});
			if (!headings.length) return;

			var key = course.current !== -1 ? course.pages[course.current].href : location.pathname;
			var stored = course.progress.read[key];
			var read = Array.isArray(stored) ? stored.slice() : [];
			var inModule = course.currentModule !== -1;

			// A clone made before this block runs lacks the class and the line,
			// so render() calls this on every root. It adds only what is missing.
			function prepare(root) {
				root.classList.add("atelier-toc-dots");
				if (!inModule || root.querySelector(".atelier-toc-progress")) return;
				var progress = element("p", "atelier-toc-progress");
				var ring = element("span", "atelier-ring");
				ring.setAttribute("aria-hidden", "true");
				progress.appendChild(ring);
				progress.appendChild(document.createTextNode(""));
				var title = root.querySelector("#toc-title");
				if (title) {
					title.after(progress);
				} else {
					root.prepend(progress);
				}
			}

			function share() {
				var pages = course.modules[course.currentModule].pages;
				var total = pages.reduce(function (sum, index) {
					if (index === course.current) return sum + read.length / headings.length;
					return sum + (course.progress.visited.indexOf(course.pages[index].href) !== -1 ? 1 : 0);
				}, 0);
				return Math.round((100 * total) / pages.length);
			}

			function render() {
				document.querySelectorAll("#quarto-margin-sidebar #TOC, .quarto-sidebar-toggle-contents #TOC").forEach(function (root) {
					prepare(root);
					headings.forEach(function (heading) {
						var link = root.querySelector('a.nav-link[data-scroll-target="' + heading.href + '"]');
						if (!link) return;
						var done = read.indexOf(heading.href) !== -1;
						var hidden = link.querySelector(":scope > .atelier-read-text");
						link.classList.toggle("atelier-read", done);
						if (done && !hidden) {
							link.appendChild(element("span", "visually-hidden atelier-read-text", " " + course.label("toc-read")));
						} else if (!done && hidden) {
							hidden.remove();
						}
					});
					var line = root.querySelector(".atelier-toc-progress");
					if (line) {
						var percent = share();
						line.querySelector(".atelier-ring").style.setProperty("--atelier-ring", percent + "%");
						line.lastChild.nodeValue = course.label("toc-module-read", { n: percent });
					}
				});
			}

			var pending = false;
			function mark(hrefs) {
				var added = hrefs.filter(function (href) { return read.indexOf(href) === -1; });
				if (!added.length) return;
				read = read.concat(added);
				if (pending) return;
				pending = true;
				requestAnimationFrame(function () {
					pending = false;
					course.progress.read[key] = read;
					course.save();
					render();
				});
			}

			var byNode = new Map(headings.map(function (heading) { return [heading.node, heading.href]; }));
			var observer = new IntersectionObserver(function (entries) {
				mark(entries.filter(function (entry) {
					return entry.boundingClientRect.top < 0;
				}).map(function (entry) { return byNode.get(entry.target); }));
			}, { threshold: [0, 1] });
			headings.forEach(function (heading) { observer.observe(heading.node); });

			// The last headings of a short final section never reach the top.
			function checkEnd() {
				var root = document.documentElement;
				if (window.innerHeight + window.scrollY >= root.scrollHeight - 2) {
					mark(headings.map(function (heading) { return heading.href; }));
				}
			}
			window.addEventListener("scroll", checkEnd, { passive: true });
			checkEnd();

			// Quarto marks the current entry with a class only. Mirror it in
			// aria-current so assistive technology announces it.
			var links = toc.querySelectorAll(".nav-link");
			function syncCurrent() {
				links.forEach(function (link) {
					if (link.classList.contains("active")) {
						link.setAttribute("aria-current", "location");
					} else {
						link.removeAttribute("aria-current");
					}
				});
			}
			syncCurrent();
			new MutationObserver(syncCurrent).observe(toc, { subtree: true, attributes: true, attributeFilter: ["class"] });

			render();
		})();
	})();
</script>
