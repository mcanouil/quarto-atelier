<style id="atelier-terminal-decoration">
/* The terminal preset decoration of the deck, as html/terminal.scss: a prompt
   and a cursor on the title, markers on headings and list items, and dashed
   rules. Each content has an empty alternative text, so a screen reader skips
   it. The cursor blinks four times, then stays steady. */
@keyframes atelier-terminal-cursor {
  50% {
    opacity: 0;
  }
}

.reveal .slides section.atelier-title-slide h1.title::before {
  content: "$ ";
  content: "$ " / "";
  color: var(--atelier-accent-ink);
}

.reveal .slides section.atelier-title-slide h1.title .atelier-cursor::before {
  content: "\2588";
  content: "\2588" / "";
  margin-left: 0.15em;
  color: var(--atelier-accent-ink);
  animation: atelier-terminal-cursor 1.1s steps(1) 4;
}

@media (prefers-reduced-motion: reduce) {
  .reveal .slides section.atelier-title-slide h1.title .atelier-cursor::before {
    animation: none;
  }
}

.reveal .slides section:not(.atelier-title-slide) :is(h2, h3) {
  border-bottom: 1px dashed var(--atelier-border);
  padding-bottom: 0.3em;
}

.reveal .slides section:not(.atelier-title-slide) :is(h2, h3)::before {
  color: var(--atelier-muted);
}

.reveal .slides section:not(.atelier-title-slide) h2::before {
  content: "## ";
  content: "## " / "";
}

.reveal .slides section:not(.atelier-title-slide) h3::before {
  content: "### ";
  content: "### " / "";
}

.reveal .slides section ul:not([class]) > li::marker {
  content: "- ";
  content: "- " / "";
  color: var(--atelier-accent-ink);
}
</style>
