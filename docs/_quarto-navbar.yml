# Quarto profile demonstrating the layout the project type ships by default:
# a navbar, with the docked sidebar beside it and the search as an overlay
# button. The site itself renders without this profile, in the book-like layout
# the other documentation sites in this family use, so this is the one place
# the navbar chrome is exercised.
#
# Render it with `quarto render docs --profile navbar`.
website:
  # A scalar in _quarto.yml switched the navbar off, so it has to be declared
  # again here rather than merged into: there is nothing left to merge with.
  navbar:
    left:
      - href: index.qmd
        text: "Home"
      - href: reference.qmd
        text: "Reference"
      - href: landing.qmd
        text: "Landing page"
      - href: examples.qmd
        text: "Examples"
      # An icon beside text, and a menu, are the two navbar item shapes Quarto
      # writes with markup of its own; Atelier repairs both. See the "Navbar and
      # search" section of examples.qmd.
      - text: "More"
        icon: three-dots
        menu:
          - href: changelog.qmd
            text: "Changelog"
          - href: https://quarto.org
            text: "Quarto"
    # A tool with only an icon, and a tool with a menu. Each one has an
    # `aria-label`, which names it for screen readers; without one, Atelier
    # names the tool from its icon.
    tools:
      - icon: github
        href: https://github.com/mcanouil/quarto-atelier
        aria-label: "Repository"
      - icon: chat-square-text
        aria-label: "Discussions"
        menu:
          - text: "Ideas"
            href: https://github.com/mcanouil/quarto-atelier/discussions/categories/ideas
          - text: "Q&A"
            href: https://github.com/mcanouil/quarto-atelier/discussions/categories/q-a
  # The project type puts an overlay search in the navbar, which is what
  # `location: navbar` restores. `website.sidebar.search` is left as it stands:
  # with the search back in the navbar, the sidebar field is dropped.
  search:
    location: navbar
    type: overlay
  # A sidebar section is the one sidebar item Quarto writes with a toggle of its
  # own; Atelier repairs it. Quarto appends these items to the flat list of the
  # site, so the section holds the pages that list leaves out.
  sidebar:
    contents:
      - section: "More examples"
        contents:
          - href: numbered-sections.qmd
            text: "Numbered sections"
          - href: listing-example/index.qmd
            text: "Listing example"
