# Quarto profile demonstrating the layout the project type ships by default:
# a navbar, with the docked sidebars beside it and the search as an overlay
# button.
#
# Render it with `quarto render docs --profile navbar`.
project:
  output-dir: _site-navbar

website:
  # A scalar in _quarto.yml switched the navbar off, so it has to be declared
  # again here rather than merged into: there is nothing left to merge with.
  navbar:
    left:
      - href: index.qmd
        text: "Home"
      - href: gallery.qmd
        text: "Gallery"
      - href: reference.qmd
        text: "Reference"
      - text: "Guides"
        menu:
          - href: templates.qmd
            text: "Templates"
          - href: workshop.qmd
            text: "Workshop mode"
          - href: formats.qmd
            text: "Typst and Reveal.js"
          - href: brand.qmd
            text: "Brand and colours"
      - href: landing.qmd
        text: "Landing page"
      - href: examples.qmd
        text: "Examples"
      - href: listing-example/index.qmd
        text: "Listing example"
      - href: about.qmd
        text: "About"
      - text: "More"
        icon: three-dots
        menu:
          - href: changelog.qmd
            text: "Changelog"
          - href: https://quarto.org
            text: "Quarto"
    tools:
      - icon: github
        href: https://github.com/mcanouil/quarto-atelier
        aria-label: "Repository"
      - icon: chat-square-text
        aria-label: "Discussions"
        menu:
          - text: "Ideas"
            href: https://github.com/mcanouil/quarto-atelier/discussions/categories/ideas
          - text: "Q&A"
            href: https://github.com/mcanouil/quarto-atelier/discussions/categories/q-a
  search:
    location: navbar
    type: overlay
