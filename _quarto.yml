project:
  type: atelier
  render:
    - index.qmd
    - example.qmd
    - reference/index.qmd
    - 404.qmd
  # Quarto copies nothing to the output directory by convention: only these
  # globs, plus files it finds behind an `href` or `src` in the rendered HTML.
  # The manifest names its icons in JSON, which is not scanned, so they are
  # listed here.
  resources:
    - favicon.ico
    - site.webmanifest
    - assets/icons/*.png
    - assets/social/og-image.png

website:
  title: "Atelier"
  description: "An accessible, brand-driven documentation-website project type for Quarto."
  site-url: &site-url https://m.canouil.dev/quarto-atelier
  repo-url: https://github.com/mcanouil/quarto-atelier
  favicon: favicon.ico
  # The leading slash marks a project-relative path, which Quarto turns into
  # `<site-url>/assets/social/og-image.png` and measures to fill the image
  # width and height tags.
  image: /assets/social/og-image.png
  image-alt: "The quarto-atelier social card: the extension name over a one-line description, beside a dark code window showing a _quarto.yml that sets the atelier project type."
  page-footer:
    right: |
      Licence: [MIT](https://github.com/mcanouil/quarto-atelier?tab=MIT-1-ov-file#readme).
  announcement:
    icon: info-circle
    dismissable: true
    type: info
    position: below-navbar
    content: "Atelier keeps this banner readable in both colour schemes."
  navbar:
    left:
      - href: index.qmd
        text: "Home"
      - href: example.qmd
        text: "Example"
      - href: reference/index.qmd
        text: "Reference"
  # A docked sidebar beside the navbar, which is what exercises the dark-pinned
  # sidebar chrome, the section collapse, the dividers, and the secondary nav
  # that Quarto renders below the navbar on small screens.
  sidebar:
    style: docked
    collapse-level: 2
    contents:
      - href: index.qmd
        text: "Home"
      - text: "---"
      - section: "Guides"
        contents:
          - href: example.qmd
            text: "Example"
      - text: "---"
      - section: "Reference"
        contents:
          - href: reference/index.qmd
            text: "Options"

# Quarto keeps the `website` block out of the metadata it hands to Lua
# filters, so the social-metadata filter cannot read `website.site-url` to
# build the canonical URL. The anchor above republishes the same scalar here,
# without a second copy of the string.
extensions:
  atelier:
    site-url: *site-url
    icon: assets/icons/icon.svg
    apple-touch-icon: assets/icons/apple-touch-icon.png
    manifest: site.webmanifest
    theme-color:
      light: "#FBFAF7"
      dark: "#14181C"
