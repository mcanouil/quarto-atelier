name: Quarto Extensions Updates

# Keeps the extensions that Atelier embeds in _extensions/atelier/_extensions/
# current: iconify, gitlink, code-window, toc-depth and collapse-output. The
# docs website uses these embedded copies, so docs/ has no extensions of its own.
on:
  workflow_dispatch:
  schedule:
    - cron: 00 12 1 * *

permissions:
  contents: read

jobs:
  updates:
    uses: mcanouil/quarto-workflows/.github/workflows/quarto-extensions-updates.yml@v2
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
    with:
      gh-app-id: ${{ vars.APP_ID }}
      scan-directories: |
        _extensions/atelier
