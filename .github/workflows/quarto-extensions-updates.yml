name: Quarto Extensions Updates

# Scans docs/, which has no committed extensions now: the website uses the
# extensions embedded in _extensions/atelier/_extensions/. The updater action
# does not support a nested _extensions/ yet, so update the embedded extensions
# with the local Quarto Wizard command in the README until it does.
on:
  workflow_dispatch:
  schedule:
    - cron: 00 12 1 * *

permissions:
  contents: read

jobs:
  updates:
    uses: mcanouil/quarto-workflows/.github/workflows/quarto-extensions-updates.yml@v2
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
    with:
      gh-app-id: ${{ vars.APP_ID }}
      scan-directories: |
        docs
